<style>
:root{--bg:#e9e9ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050505}}
:root[data-theme="dark"]{--bg:#050505}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#161616;-webkit-text-size-adjust:100%;touch-action:manipulation}
@supports (height:100dvh){html{height:100dvh}}
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{display:flex;justify-content:center;align-items:center}
#app{width:100%;max-width:430px;height:100%;background:#161616;color:#fff;container-type:inline-size;overflow:hidden;position:relative}
@media (min-width:560px){html,body{background:var(--bg)}#app{height:min(100%,900px);border-radius:48px;border:6px solid #2b2b2e}}
#screen{height:100%;display:flex;flex-direction:column;padding:5cqw 5cqw 4cqw;position:relative}
.handle{width:9cqw;height:1cqw;border-radius:1cqw;background:#454545;margin:0 auto;flex:none}
.round{width:12.4cqw;height:12.4cqw;border-radius:50%;border:1px solid #2c2c2c;background:#1b1b1b;color:#d8d8d8;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;padding:0}
.round svg{width:5.4cqw;height:5.4cqw}
.round.on{background:#2a2a2a;color:#fff}
.round.top{position:absolute;top:9cqw;right:4.4cqw;width:8cqw;height:8cqw;background:#2a2a2a;border:0;color:#cfcfcf;z-index:2}
.round.top svg{width:3.8cqw;height:3.8cqw}
.round.top.plus{right:14.4cqw}
#main{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
#main::-webkit-scrollbar{display:none}
.title{display:flex;justify-content:center;align-items:center;margin:14cqw 0 5cqw}
.nz{flex:1;height:12cqw;background:none;border:0;cursor:pointer}
.title h1{margin:0;font-size:10.4cqw;font-weight:800;letter-spacing:-.02em;line-height:1.1;text-align:center}
.title h1 small{display:block;font-size:2.6cqw;color:#777;font-weight:500;letter-spacing:.1em}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.6cqw .8cqw}
.dw{display:flex;justify-content:center;margin-bottom:2.2cqw}
.dw span{background:#242424;color:#a9a9a9;font-size:2.6cqw;height:5cqw;line-height:5cqw;padding:0 2.2cqw;border-radius:2.5cqw;letter-spacing:.02em}
.cell{aspect-ratio:.79;background:#252525;border:.6cqw solid transparent;border-radius:2.8cqw;padding:1.8cqw 1.6cqw;text-align:left;color:#fff;cursor:pointer;overflow:hidden;min-width:0}
.cell span{display:block;font-size:3.5cqw;font-weight:700;line-height:1;margin-bottom:.8cqw}
.cell.dim{background:#1c1c1c;color:#363636;cursor:default}
.cell.today{border-color:#fff}
.ev{display:flex;align-items:center;gap:.6cqw;font-size:1.5cqw;color:#8b8b8b;font-style:normal;white-space:nowrap;overflow:hidden;margin-top:.5cqw;line-height:1.3}
.ev b{width:.7cqw;height:1.7cqw;border-radius:.3cqw;flex:none}
.ev.pl,.ev.tag{display:block;padding-left:1.3cqw;margin-top:0;text-overflow:ellipsis}
.ev.pl{color:#6f6f6f}
.chips{display:flex;flex-wrap:wrap;gap:1.8cqw;margin-top:5.6cqw}
.chip{background:#212121;border:0;color:#c4c4c4;border-radius:4cqw;height:6.8cqw;padding:0 3.2cqw;font-size:3cqw;cursor:pointer;display:flex;align-items:center}
.chip.on{background:#2e2e2e;color:#fff;font-weight:600}
.chip i{width:1.5cqw;height:1.5cqw;border-radius:50%;margin-right:1.4cqw;background:#888}
#bar{display:flex;gap:2cqw;align-items:center;margin-top:2.5cqw;flex:none}
.plans{flex:1;min-width:0;height:12cqw;border-radius:6cqw;border:1px solid #2c2c2c;background:#1a1a1a;color:#6b6b6b;font-size:3.3cqw;display:flex;align-items:center;overflow:hidden}
.plans input{flex:1;min-width:0;height:100%;background:none;border:0;outline:none;color:#fff;font:inherit;font-size:16px;padding:0 0 0 3.6cqw;text-overflow:ellipsis}
.plans input::placeholder{color:#6b6b6b;opacity:1;font-size:3.2cqw}
.plans.rec input::placeholder{color:#ff3b30}
.mic{width:10cqw;height:100%;background:none;border:0;color:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.mic svg{width:4.4cqw;height:4.4cqw}
.plans.rec{border-color:#ff3b30;color:#ff3b30}
.plans.rec .mic{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.row{display:flex;align-items:center;gap:3cqw;background:#212121;border-radius:3cqw;padding:2.8cqw 3.2cqw;margin-bottom:2cqw}
.row .t{font-weight:700;font-size:3.6cqw;min-width:12cqw}
.row .i{flex:1;font-size:3.4cqw}.row .i div{color:#888;font-size:2.8cqw;margin-top:.5cqw}
.folder{cursor:pointer}
.x{background:none;border:0;color:#777;font-size:4.2cqw;cursor:pointer}
.add{width:100%;height:11cqw;border-radius:6cqw;border:1px dashed #3a3a3a;background:none;color:#bbb;cursor:pointer;font-size:3.2cqw;margin-top:1cqw}
.empty{color:#666;font-size:3cqw;text-align:center;padding:4cqw}
.back{background:none;border:0;color:#9ab;cursor:pointer;font-size:3.4cqw;margin:6cqw 0 0;padding:0}
#modal{position:absolute;inset:0;background:#000b;display:none;align-items:flex-end;z-index:5}
#modal.show{display:flex}
.box{width:100%;background:#161616;border-top:1px solid #262626;border-radius:6cqw 6cqw 0 0;padding:2.5cqw 5cqw 5cqw;max-height:90%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;color:#fff}
.box h2{margin:5cqw 0 1cqw;font-size:6.4cqw;font-weight:800;letter-spacing:-.02em}
.box label{display:inline-block;background:#242424;color:#a9a9a9;font-size:2.6cqw;height:5cqw;line-height:5cqw;padding:0 2.2cqw;border-radius:2.5cqw;margin:4cqw 0 2cqw;letter-spacing:.02em;text-transform:uppercase}
.box input{display:block;width:100%;height:12cqw;border-radius:6cqw;border:1px solid #2c2c2c;background:#1a1a1a;color:#fff;font-size:16px;padding:0 4.2cqw;color-scheme:dark;outline:none;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;text-align:left}
.box input::-webkit-date-and-time-value{text-align:left}
.box input:focus{border-color:#555}
.box .chips{margin-top:0}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.8cqw}
.dp{height:10cqw;border-radius:2.8cqw;border:0;background:#252525;color:#bbb;font-size:2.6cqw;font-weight:600;cursor:pointer;padding:0}
.dp.on{background:#fff;color:#000}
.btns{display:flex;gap:2cqw;margin-top:6cqw}
.btns button{flex:1;height:12cqw;border-radius:6cqw;border:1px solid #2c2c2c;font-size:3.6cqw;cursor:pointer;background:#1b1b1b;color:#d8d8d8}
.btns .ok{background:#fff;color:#000;font-weight:700;border-color:#fff}
#toast{position:absolute;bottom:20cqw;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:2.4cqw 4cqw;border-radius:5cqw;font-size:3.4cqw;opacity:0;transition:.3s;pointer-events:none;z-index:9;width:max-content;max-width:88%;text-align:center;line-height:1.35}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"><div id="screen">
  <div class="handle"></div>
  <button class="round top" id="bToday" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><circle cx="11" cy="11" r="1.7" fill="currentColor" stroke="none"/><path d="M16 16l4 4"/></svg></button>
  <button class="round top plus" id="bAdd" aria-label="Add lecture"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <div id="main"></div>
  <div id="bar">
    <div class="plans"><input id="plans" type="text" placeholder="What are your plans?" autocomplete="off" enterkeyhint="send"><button class="mic" id="mic" aria-label="Voice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button></div>
    <button class="round" id="bCal" aria-label="Calendar"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="4.5" fill="currentColor"/><rect x="7.2" y="2" width="2.2" height="4.5" rx="1.1" fill="currentColor"/><rect x="14.6" y="2" width="2.2" height="4.5" rx="1.1" fill="currentColor"/><g fill="#1b1b1b"><circle cx="8" cy="11" r="1.3"/><circle cx="12" cy="11" r="1.3"/><circle cx="16" cy="11" r="1.3"/><circle cx="8" cy="15.5" r="1.3"/><circle cx="12" cy="15.5" r="1.3"/><circle cx="16" cy="15.5" r="1.3"/></g></svg></button>
    <button class="round" id="bSub" aria-label="Subjects"><svg viewBox="0 0 24 24"><rect x="3" y="3.5" width="18" height="5.5" rx="2" fill="currentColor"/><rect x="4.5" y="10" width="15" height="10.5" rx="3" fill="currentColor"/><rect x="9" y="13" width="6" height="2.2" rx="1.1" fill="#1b1b1b"/></svg></button>
    <button class="round" id="bSet" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M12 2.8l8 4.6v9.2l-8 4.6-8-4.6V7.4z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="#1b1b1b"/></svg></button>
  </div>
</div>
<div id="modal"><div class="box" id="box"></div></div>
<div id="toast"></div>
</div>

<script>
// ===== Put your Google OAuth client id here to turn on Drive sync =====
var CLIENT_ID = "";

var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
var WEEK = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var SHORT = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
var PALETTE = ["#ff3b30","#34c759","#0a84ff","#ff9f0a","#bf5af2","#64d2ff"];

var state = { subjects: [], lectures: [], rootId: null };
try { var saved = localStorage.getItem("campus"); if (saved) state = JSON.parse(saved); } catch (e) {}
if (!state.events) state.events = [];
function save() { try { localStorage.setItem("campus", JSON.stringify(state)); } catch (e) {} }

var today = new Date();
var view = new Date(today.getFullYear(), today.getMonth(), 1);
var tab = "cal";
var openId = null;
var filterId = null;
var token = null;

function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
function toast(msg) { var t = document.getElementById("toast"); t.textContent = msg; t.className = "show"; setTimeout(function () { t.className = ""; }, 2500); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function colorOf(id) {
  for (var i = 0; i < state.subjects.length; i++) if (state.subjects[i].id === id) return PALETTE[i % PALETTE.length];
  return "#888";
}
function subjectName(id) {
  for (var i = 0; i < state.subjects.length; i++) if (state.subjects[i].id === id) return state.subjects[i].name;
  return "?";
}

// ===== Modal (onOk = null shows only a Close button) =====
function openModal(html, onOk) {
  var box = document.getElementById("box");
  box.innerHTML = '<div class="handle"></div>' + html + '<div class="btns"><button id="mCancel">' + (onOk ? "Cancel" : "Close") + "</button>" + (onOk ? '<button class="ok" id="mOk">Save</button>' : "") + "</div>";
  document.getElementById("modal").className = "show";
  document.getElementById("modal").onclick = function (e) { if (e.target === this) closeModal(); };
  document.getElementById("mCancel").onclick = closeModal;
  if (onOk) document.getElementById("mOk").onclick = function () { if (onOk() !== false) closeModal(); };
}
function closeModal() { document.getElementById("modal").className = ""; }

// ===== Entry types =====
var KINDS = [["lecture", "Lecture"], ["section", "Section"], ["lab", "Lab"], ["quiz", "Quiz"], ["deadline", "Deadline"], ["midterm", "Midterm"], ["final", "Final"]];
var KIND_COLOR = { quiz: "#ff9f0a", deadline: "#ff453a", midterm: "#bf5af2", final: "#bf5af2" };
var TAGS = { lecture: "Lec", section: "Sec", lab: "Lab" };
function isWeekly(kind) { return kind === "lecture" || kind === "section" || kind === "lab"; }
function kindLabel(kind) {
  for (var i = 0; i < KINDS.length; i++) if (KINDS[i][0] === kind) return KINDS[i][1];
  return "Lecture";
}
function iso(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }

// ===== Calendar =====
function lecturesOn(dow, useFilter) {
  return state.lectures.filter(function (l) { return l.weekday === dow && (!useFilter || !filterId || l.subjectId === filterId); })
    .sort(function (a, b) { return a.time < b.time ? -1 : 1; });
}

function cellLines(date, dow) {
  var lines = [];
  var day = iso(date);
  state.events.filter(function (e) { return e.date === day && (!filterId || e.subjectId === filterId); })
    .forEach(function (e) {
      lines.push({ color: colorOf(e.subjectId), text: subjectName(e.subjectId), cls: "" });
      lines.push({ text: kindLabel(e.kind) + (e.note ? " · " + e.note : ""), cls: "tag", color: KIND_COLOR[e.kind] });
    });
  var list = lecturesOn(dow, true);
  var done = {};
  list.forEach(function (l) {
    if (done[l.subjectId]) return;
    done[l.subjectId] = true;
    lines.push({ color: colorOf(l.subjectId), text: subjectName(l.subjectId), cls: "" });
    list.filter(function (x) { return x.subjectId === l.subjectId; }).forEach(function (x) {
      lines.push({ text: (TAGS[x.kind] || "Lec") + " " + x.place, cls: "pl" });
    });
  });
  return lines.slice(0, 5);
}

function renderCalendar() {
  var y = view.getFullYear(), m = view.getMonth();
  var html = '<div class="title"><button class="nz" id="prev" aria-label="Previous month"></button><h1>' + MONTHS[m] + (y !== today.getFullYear() ? "<small>" + y + "</small>" : "") + '</h1><button class="nz" id="next" aria-label="Next month"></button></div><div class="grid">';
  SHORT.forEach(function (d) { html += '<div class="dw"><span>' + d + "</span></div>"; });
  var first = new Date(y, m, 1).getDay();
  var total = new Date(y, m + 1, 0).getDate();
  var prevTotal = new Date(y, m, 0).getDate();
  var cells = Math.ceil((first + total) / 7) * 7;
  for (var i = 0; i < cells; i++) {
    var n = i - first + 1;
    if (n < 1) { html += '<div class="cell dim"><span>' + (prevTotal + n) + "</span></div>"; continue; }
    if (n > total) { html += '<div class="cell dim"><span>' + (n - total) + "</span></div>"; continue; }
    var isToday = y === today.getFullYear() && m === today.getMonth() && n === today.getDate();
    html += '<button class="cell' + (isToday ? " today" : "") + '" data-d="' + n + '"><span>' + n + "</span>";
    cellLines(new Date(y, m, n), i % 7).forEach(function (ln) {
      if (ln.cls === "") html += '<i class="ev"><b style="background:' + ln.color + '"></b>' + esc(ln.text) + "</i>";
      else html += '<i class="ev ' + ln.cls + '"' + (ln.color ? ' style="color:' + ln.color + '"' : "") + ">" + esc(ln.text) + "</i>";
    });
    html += "</button>";
  }
  html += '</div><div class="chips"><button class="chip' + (filterId ? "" : " on") + '" data-f=""><i></i>All</button>';
  state.subjects.forEach(function (s) {
    html += '<button class="chip' + (filterId === s.id ? " on" : "") + '" data-f="' + s.id + '"><i style="background:' + colorOf(s.id) + '"></i>' + esc(s.name) + "</button>";
  });
  html += "</div>";

  var main = document.getElementById("main");
  main.innerHTML = html;
  document.getElementById("prev").onclick = function () { view = new Date(y, m - 1, 1); render(); };
  document.getElementById("next").onclick = function () { view = new Date(y, m + 1, 1); render(); };
  var startX = 0;
  main.ontouchstart = function (e) { startX = e.touches[0].clientX; };
  main.ontouchend = function (e) {
    var dx = e.changedTouches[0].clientX - startX;
    if (dx > 60) { view = new Date(y, m - 1, 1); render(); }
    if (dx < -60) { view = new Date(y, m + 1, 1); render(); }
  };
  main.querySelectorAll(".cell[data-d]").forEach(function (b) {
    b.onclick = function () { openDay(new Date(y, m, +b.getAttribute("data-d"))); };
  });
  main.querySelectorAll(".chip").forEach(function (b) {
    b.onclick = function () { filterId = b.getAttribute("data-f") || null; render(); };
  });
}

function openDay(date) {
  var day = iso(date);
  var events = state.events.filter(function (e) { return e.date === day; });
  var list = lecturesOn(date.getDay(), false);
  var html = "<h2>" + WEEK[date.getDay()] + ", " + date.getDate() + " " + MONTHS[date.getMonth()] + "</h2>";
  if (!events.length && !list.length) html += '<div class="empty">Nothing on this day</div>';
  events.forEach(function (e) {
    html += '<div class="row"><span class="t">' + (e.time ? esc(e.time) : "—") + '</span><div class="i">' + esc(subjectName(e.subjectId)) + "<div>" + kindLabel(e.kind) + (e.note ? " · " + esc(e.note) : "") + '</div></div><button class="x" data-evdel="' + e.id + '">✕</button></div>';
  });
  list.forEach(function (l) {
    html += '<div class="row"><span class="t">' + esc(l.time || "—") + '</span><div class="i">' + esc(subjectName(l.subjectId)) + "<div>" + kindLabel(l.kind) + " · 📍 " + esc(l.place) + '</div></div><button class="x" data-del="' + l.id + '">✕</button></div>';
  });
  html += '<button class="add" id="addLec">+ Add entry</button>';
  openModal(html, null);
  document.querySelectorAll("[data-del]").forEach(function (b) {
    b.onclick = function () {
      state.lectures = state.lectures.filter(function (l) { return l.id !== b.getAttribute("data-del"); });
      save(); render(); openDay(date);
    };
  });
  document.querySelectorAll("[data-evdel]").forEach(function (b) {
    b.onclick = function () {
      state.events = state.events.filter(function (e) { return e.id !== b.getAttribute("data-evdel"); });
      save(); render(); openDay(date);
    };
  });
  document.getElementById("addLec").onclick = function () { addLecture(date.getDay(), { date: day }); };
}

function addLecture(dow, pre) {
  if (!state.subjects.length) { addSubject(function () { addLecture(dow, pre); }); return; }
  pre = pre || {};
  var subId = pre.subjectId || state.subjects[0].id;
  var kind = pre.kind || "lecture";
  var day = dow;
  var html = "<h2>New entry</h2>";
  if (pre.heard) html += '<div style="color:#8b8b8b;font-size:3cqw">' + (pre.icon || "🎙") + " " + esc(pre.heard) + "</div>";
  html += '<label>Type</label><div class="chips">';
  KINDS.forEach(function (k) {
    html += '<button class="chip' + (k[0] === kind ? " on" : "") + '" data-k="' + k[0] + '">' + k[1] + "</button>";
  });
  html += '</div><label>Subject</label><div class="chips">';
  state.subjects.forEach(function (s) {
    html += '<button class="chip' + (s.id === subId ? " on" : "") + '" data-s="' + s.id + '"><i style="background:' + colorOf(s.id) + '"></i>' + esc(s.name) + "</button>";
  });
  html += '</div><div id="wk"><label>Day (repeats weekly)</label><div class="days">';
  SHORT.forEach(function (d, i) { html += '<button class="dp' + (i === dow ? " on" : "") + '" data-day="' + i + '">' + d + "</button>"; });
  html += '</div><label>Place</label><input id="fPlace" placeholder="Hall / building, e.g. Hall 3"></div>';
  html += '<div id="dt"><label>Date</label><input id="fDate" type="date"><label>Note (optional)</label><input id="fNote" placeholder="e.g. Section, Lab, Project"></div>';
  html += '<label>Time</label><input id="fTime" type="time">';

  openModal(html, function () {
    var time = document.getElementById("fTime").value;
    if (isWeekly(kind)) {
      var place = document.getElementById("fPlace").value.trim();
      if (!place) { toast("Write the place"); return false; }
      state.lectures.push({ id: uid(), subjectId: subId, kind: kind, weekday: day, time: time, place: place });
    } else {
      var date = document.getElementById("fDate").value;
      if (!date) { toast("Pick the date"); return false; }
      state.events.push({ id: uid(), subjectId: subId, kind: kind, date: date, time: time, note: document.getElementById("fNote").value.trim() });
      var p = date.split("-");
      view = new Date(+p[0], +p[1] - 1, 1);
    }
    save(); render();
  });

  document.getElementById("fTime").value = pre.time || (isWeekly(kind) ? "09:00" : "");
  document.getElementById("fPlace").value = pre.place || "";
  document.getElementById("fDate").value = pre.date || iso(today);
  document.getElementById("fNote").value = pre.note || "";

  function showBlocks() {
    document.getElementById("wk").style.display = isWeekly(kind) ? "" : "none";
    document.getElementById("dt").style.display = isWeekly(kind) ? "none" : "";
  }
  showBlocks();

  document.querySelectorAll("[data-k]").forEach(function (b) {
    b.onclick = function () {
      kind = b.getAttribute("data-k");
      document.querySelectorAll("[data-k]").forEach(function (o) { o.className = "chip" + (o === b ? " on" : ""); });
      if (isWeekly(kind) && !document.getElementById("fTime").value) document.getElementById("fTime").value = "09:00";
      showBlocks();
    };
  });
  document.querySelectorAll("[data-s]").forEach(function (b) {
    b.onclick = function () {
      subId = b.getAttribute("data-s");
      document.querySelectorAll("[data-s]").forEach(function (o) { o.className = "chip" + (o === b ? " on" : ""); });
    };
  });
  document.querySelectorAll("[data-day]").forEach(function (b) {
    b.onclick = function () {
      day = +b.getAttribute("data-day");
      document.querySelectorAll("[data-day]").forEach(function (o) { o.className = "dp" + (o === b ? " on" : ""); });
    };
  });
}

// ===== Subjects (folders) =====
function addSubject(after) {
  openModal('<h2>New subject</h2><label>Name</label><input id="fName" placeholder="e.g. Data Structures">', function () {
    var name = document.getElementById("fName").value.trim();
    if (!name) return false;
    var s = { id: uid(), name: name, files: [], folderId: null };
    state.subjects.push(s); save(); render();
    if (token) ensureSubjectFolder(s);
    if (after) setTimeout(after, 0);
  });
}

function renderSubjects() {
  var main = document.getElementById("main");
  main.ontouchstart = null; main.ontouchend = null;
  var cur = state.subjects.filter(function (s) { return s.id === openId; })[0];
  if (cur) { renderFolder(main, cur); return; }
  var html = '<div class="title"><h1>Subjects</h1></div>';
  if (!state.subjects.length) html += '<div class="empty">No subjects yet</div>';
  state.subjects.forEach(function (s) {
    html += '<div class="row folder" data-id="' + s.id + '"><span style="font-size:22px">📁</span><div class="i"><b>' + esc(s.name) + "</b><div>" + s.files.length + ' files</div></div><button class="x" data-del="' + s.id + '">✕</button></div>';
  });
  html += '<button class="add" id="addSub">+ Add subject</button>';
  main.innerHTML = html;
  main.querySelectorAll(".folder").forEach(function (r) { r.onclick = function () { openId = r.getAttribute("data-id"); render(); }; });
  main.querySelectorAll("[data-del]").forEach(function (b) {
    b.onclick = function (e) {
      e.stopPropagation();
      var id = b.getAttribute("data-del");
      state.subjects = state.subjects.filter(function (s) { return s.id !== id; });
      state.lectures = state.lectures.filter(function (l) { return l.subjectId !== id; });
      state.events = state.events.filter(function (e) { return e.subjectId !== id; });
      if (filterId === id) filterId = null;
      save(); render();
    };
  });
  document.getElementById("addSub").onclick = function () { addSubject(null); };
}

function renderFolder(main, s) {
  var html = '<button class="back" id="back">‹ All subjects</button><div class="title" style="margin-top:0"><h1 style="font-size:30px">' + esc(s.name) + "</h1></div>";
  if (!s.files.length) html += '<div class="empty">No files yet</div>';
  s.files.forEach(function (f, i) {
    html += '<div class="row"><span style="font-size:20px">📄</span><div class="i">' + esc(f.name) + "<div>" + (f.onDrive ? "Saved to Drive ✓" : "Saved here only") + '</div></div><button class="x" data-i="' + i + '">✕</button></div>';
  });
  html += '<button class="add" id="pick">+ Add lecture files</button><input type="file" id="file" multiple style="display:none">';
  main.innerHTML = html;
  document.getElementById("back").onclick = function () { openId = null; render(); };
  main.querySelectorAll("[data-i]").forEach(function (b) {
    b.onclick = function () { s.files.splice(+b.getAttribute("data-i"), 1); save(); render(); };
  });
  var input = document.getElementById("file");
  document.getElementById("pick").onclick = function () { input.click(); };
  input.onchange = function () {
    Array.prototype.forEach.call(input.files, function (file) {
      var entry = { name: file.name, onDrive: false };
      s.files.push(entry);
      if (token) uploadToDrive(s, file, entry);
    });
    save(); render();
  };
}

// ===== Voice + typing: say or type a sentence, the app fills the form, you confirm =====
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var rec = null;

function pad(n) { return (n < 10 ? "0" : "") + n; }
function digits(text) { return text.replace(/[٠-٩]/g, function (d) { return "٠١٢٣٤٥٦٧٨٩".indexOf(d); }); }
function clean(text) {
  var t = digits(text.toLowerCase());
  return t.replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي");
}
function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }

var DAY_WORDS = [
  ["sunday", "الاحد"], ["monday", "الاثنين", "الاتنين"], ["tuesday", "الثلاثاء", "التلات"],
  ["wednesday", "الاربعاء", "الاربع"], ["thursday", "الخميس"], ["friday", "الجمعه"], ["saturday", "السبت"]
];
var MONTH_WORDS = [
  ["january", "يناير"], ["february", "فبراير"], ["march", "مارس"], ["april", "ابريل"], ["may", "مايو"], ["june", "يونيو"],
  ["july", "يوليو"], ["august", "اغسطس"], ["september", "سبتمبر"], ["october", "اكتوبر"], ["november", "نوفمبر"], ["december", "ديسمبر"]
];

// weekday number (0 = Sunday) or null
function findDay(t) {
  for (var i = 0; i < 7; i++)
    for (var j = 0; j < DAY_WORDS[i].length; j++) if (t.indexOf(DAY_WORDS[i][j]) !== -1) return i;
  if (/بكره|بكرا|tomorrow/.test(t)) return (today.getDay() + 1) % 7;
  if (/النهارده|انهارده|today/.test(t)) return today.getDay();
  return null;
}

// a real date for quiz / deadline / midterm, or null
function findDate(t) {
  var base = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  for (var mo = 0; mo < 12; mo++) {
    for (var w = 0; w < 2; w++) {
      var name = MONTH_WORDS[mo][w];
      var m = t.match(new RegExp("(\\d{1,2})\\s*(?:من|of)?\\s*" + name)) || t.match(new RegExp(name + "\\s*(\\d{1,2})"));
      if (m) {
        var d = new Date(base.getFullYear(), mo, +m[1]);
        if (d < base) d = new Date(base.getFullYear() + 1, mo, +m[1]);
        return d;
      }
    }
  }
  var s = t.match(/(\d{1,2})\/(\d{1,2})/);
  if (s) {
    var d2 = new Date(base.getFullYear(), +s[2] - 1, +s[1]);
    if (d2 < base) d2 = new Date(base.getFullYear() + 1, +s[2] - 1, +s[1]);
    return d2;
  }
  if (/بعد بكره|بعد بكرا|day after tomorrow/.test(t)) return addDays(base, 2);
  if (/بكره|بكرا|tomorrow/.test(t)) return addDays(base, 1);
  if (/النهارده|انهارده|today/.test(t)) return base;
  var wd = findDay(t);
  if (wd !== null) {
    var diff = (wd - base.getDay() + 7) % 7;
    if (diff === 0) diff = 7; // "Saturday" said on a Saturday means next Saturday
    return addDays(base, diff);
  }
  return null;
}

function findTime(t) {
  var m = t.match(/(?:الساعه|\bat|عند)\s*(\d{1,2})(?:[:.](\d{2}))?/) || t.match(/(\d{1,2})[:.](\d{2})/);
  if (!m) return null;
  var h = +m[1], min = m[2] ? +m[2] : 0;
  if (h > 23) return null;
  if (t.indexOf("ونص") !== -1) min = 30;
  if (t.indexOf("وربع") !== -1) min = 15;
  var pm = /مساء|بالليل|العصر|العشا|بعد الظهر|\bpm\b|p\.m/.test(t);
  var am = /صباحا|الصبح|\bam\b|a\.m/.test(t);
  if (pm && h < 12) h += 12;
  else if (!am && h >= 1 && h <= 6) h += 12; // a lecture at 3 means 3 PM
  return pad(h) + ":" + pad(min);
}

function findSubject(t) {
  var best = null;
  state.subjects.forEach(function (s) {
    var name = clean(s.name).trim();
    if (name && t.indexOf(name) !== -1 && (!best || name.length > clean(best.name).length)) best = s;
  });
  return best ? best.id : null;
}

function findPlace(raw) {
  var words = "(?:ال)?(?:قاعه|قاعة|مدرج|معمل|لاب|مبني|مبنى|hall|room|lab|building)";
  var m = raw.match(new RegExp("(?:في|in|at)\\s*(" + words + "\\s*.*)", "i")) || raw.match(new RegExp("(" + words + "\\s*.*)", "i"));
  if (!m) return "";
  return m[1].split(/\s(?:يوم|الساعه|الساعة|at|on)\s/i)[0].trim();
}

// what kind of entry is it? quiz / deadline / midterm / final are dated, the rest repeat weekly
function findKind(t) {
  if (/كويز|quiz/.test(t)) return "quiz";
  if (/تسليم|ديدلاين|deadline|\bdue\b|submission|assignment|واجب/.test(t)) return "deadline";
  if (/ميد ?ت[يا]?رم|mid ?-?term/.test(t)) return "midterm";
  if (/فاينل|final|نهائي/.test(t)) return "final";
  if (/سكشن|section/.test(t)) return "section";
  if (/محاضره|lecture/.test(t)) return "lecture";
  // "lab" is a type only when it is not just the place ("in lab 2")
  var withoutPlace = t.replace(/(?:في|in|at)\s*(?:ال)?(?:لاب|\blab|معمل)\S*(?:\s*\d+)?/g, "");
  if (/لاب|\blab\b|معمل/.test(withoutPlace)) return "lab";
  return "lecture";
}

// the extra note: "quiz in the section", "project deadline" ...
function findNote(t) {
  if (/مشروع|project/.test(t)) return "Project";
  if (/سكشن|section/.test(t)) return "Section";
  if (/لاب|معمل|\blab\b/.test(t)) return "Lab";
  if (/محاضره|lecture/.test(t)) return "Lecture";
  if (/تقرير|report/.test(t)) return "Report";
  return "";
}

function handlePhrase(text, icon) {
  var t = clean(text);
  var kind = findKind(t);
  var pre = { heard: text, icon: icon, subjectId: findSubject(t), kind: kind, time: findTime(t) };
  var dow = today.getDay();
  if (isWeekly(kind)) {
    var d = findDay(t);
    if (d !== null) dow = d;
    pre.place = findPlace(digits(text));
  } else {
    var date = findDate(t) || today;
    pre.date = iso(date);
    pre.note = findNote(t);
    dow = date.getDay();
  }
  addLecture(dow, pre);
}

function setListening(on) {
  document.querySelector(".plans").className = "plans" + (on ? " rec" : "");
  document.getElementById("plans").placeholder = on ? "Listening…" : "What are your plans?";
}

// ===== Search =====
function openSearch() {
  openModal('<h2>Search</h2><input id="fQ" type="text" placeholder="Subject, place, quiz…" autocomplete="off" enterkeyhint="search"><button class="add" id="goToday" style="margin-top:3cqw">Go to today</button><div id="qRes" style="margin-top:3cqw"></div>', null);
  var q = document.getElementById("fQ"), box = document.getElementById("qRes");
  function jump(d) { closeModal(); tab = "cal"; view = new Date(d.getFullYear(), d.getMonth(), 1); render(); openDay(d); }
  function run() {
    var k = clean(q.value).trim(), out = [];
    if (!k) { box.innerHTML = '<div class="empty">Type a subject, place or type (quiz, lab…)</div>'; return; }
    function hit(t) { return clean(t).indexOf(k) !== -1; }
    var base = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    state.subjects.forEach(function (s) {
      if (hit(s.name)) out.push({ icon: "📁", title: s.name, sub: s.files.length + " files", go: function () { closeModal(); tab = "sub"; openId = s.id; render(); } });
    });
    state.lectures.forEach(function (l) {
      var n = subjectName(l.subjectId);
      if (hit(n + " " + kindLabel(l.kind) + " " + l.place + " " + WEEK[l.weekday]))
        out.push({ icon: l.time || "—", title: n, sub: kindLabel(l.kind) + " · " + WEEK[l.weekday] + " · 📍 " + l.place, go: function () { jump(addDays(base, (l.weekday - base.getDay() + 7) % 7)); } });
    });
    state.events.forEach(function (e) {
      var n = subjectName(e.subjectId), p = e.date.split("-");
      if (hit(n + " " + kindLabel(e.kind) + " " + (e.note || "") + " " + e.date))
        out.push({ icon: e.time || "—", title: n, sub: kindLabel(e.kind) + " · " + e.date + (e.note ? " · " + e.note : ""), go: function () { jump(new Date(+p[0], +p[1] - 1, +p[2])); } });
    });
    box.innerHTML = out.length ? out.map(function (r, i) {
      return '<div class="row folder" data-r="' + i + '"><span class="t">' + esc(r.icon) + '</span><div class="i">' + esc(r.title) + "<div>" + esc(r.sub) + "</div></div></div>";
    }).join("") : '<div class="empty">No results</div>';
    box.querySelectorAll("[data-r]").forEach(function (b) { b.onclick = function () { out[+b.getAttribute("data-r")].go(); }; });
  }
  q.oninput = run;
  document.getElementById("goToday").onclick = function () { closeModal(); tab = "cal"; view = new Date(today.getFullYear(), today.getMonth(), 1); render(); };
  run();
  q.focus();
}

var VOICE_ERR = {
  "not-allowed": "Microphone is blocked — allow it in your browser settings",
  "service-not-allowed": "Voice is blocked here — open the link in Chrome or Safari (on iPhone turn on Dictation in Settings › Keyboard)",
  "no-speech": "I didn’t hear anything — tap the mic and start speaking right away",
  "audio-capture": "No microphone found",
  "network": "Voice needs an internet connection",
  "language-not-supported": "This voice language isn’t supported on your phone"
};

function listen() {
  if (rec) { rec.stop(); return; }
  if (!SR) { toast("Voice isn’t supported here — type your plan instead"); return; }
  if (!state.subjects.length) { addSubject(null); toast("Add a subject first, then tap the mic"); return; }
  var r = new SR(), heard = "", failed = false, input = document.getElementById("plans");
  r.lang = state.lang === "en" ? "en-US" : "ar-EG";
  r.continuous = false; r.interimResults = true; r.maxAlternatives = 1;
  r.onstart = function () { setListening(true); };
  r.onresult = function (e) {
    var t = "";
    for (var i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
    heard = t; input.value = t;
  };
  r.onerror = function (e) {
    if (e.error === "aborted") return;
    failed = true; toast(VOICE_ERR[e.error] || "Voice error: " + e.error);
  };
  r.onend = function () {
    rec = null; setListening(false); input.value = "";
    if (failed) return;
    if (heard.trim()) handlePhrase(heard.trim());
    else toast(VOICE_ERR["no-speech"]);
  };
  rec = r;
  try { r.start(); } catch (err) { rec = null; setListening(false); toast("Could not start the microphone"); }
}


// ===== Google Drive =====
function connectDrive() {
  if (!CLIENT_ID) { toast("Drive needs a Google client id (see the code)"); return; }
  var script = document.createElement("script");
  script.src = "https://accounts.google.com/gsi/client";
  script.onload = function () {
    google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: "https://www.googleapis.com/auth/drive.file",
      callback: function (r) { token = r.access_token; toast("Drive connected ✓"); }
    }).requestAccessToken();
  };
  document.head.appendChild(script);
}
function drive(url, opts) {
  opts.headers = Object.assign({ Authorization: "Bearer " + token }, opts.headers || {});
  return fetch(url, opts).then(function (r) { return r.json(); });
}
function makeFolder(name, parent) {
  var body = { name: name, mimeType: "application/vnd.google-apps.folder" };
  if (parent) body.parents = [parent];
  return drive("https://www.googleapis.com/drive/v3/files", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
    .then(function (r) { return r.id; });
}
function ensureSubjectFolder(s) {
  var rootP = state.rootId ? Promise.resolve(state.rootId) : makeFolder("Lektra", null);
  return rootP.then(function (rootId) {
    state.rootId = rootId;
    if (s.folderId) return s.folderId;
    return makeFolder(s.name, rootId).then(function (id) { s.folderId = id; save(); return id; });
  });
}
function uploadToDrive(s, file, entry) {
  ensureSubjectFolder(s).then(function (folderId) {
    var form = new FormData();
    form.append("metadata", new Blob([JSON.stringify({ name: file.name, parents: [folderId] })], { type: "application/json" }));
    form.append("file", file);
    return drive("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", { method: "POST", body: form });
  }).then(function () { entry.onDrive = true; save(); render(); toast("Uploaded to Drive ✓"); });
}

// ===== Buttons + start =====
function render() {
  document.getElementById("bCal").className = "round" + (tab === "cal" ? " on" : "");
  document.getElementById("bSub").className = "round" + (tab === "sub" ? " on" : "");
  if (tab === "cal") renderCalendar(); else renderSubjects();
}
document.getElementById("bCal").onclick = function () { tab = "cal"; render(); };
document.getElementById("bSub").onclick = function () { tab = "sub"; openId = null; render(); };
document.getElementById("bToday").onclick = openSearch;
document.getElementById("plans").onkeydown = function (e) {
  if (e.key === "Enter" && this.value.trim()) { handlePhrase(this.value.trim(), "✎"); this.value = ""; }
};
document.getElementById("bAdd").onclick = function () { addLecture(today.getDay()); };
document.getElementById("mic").onclick = listen;
document.getElementById("bSet").onclick = function () {
  openModal('<h2>Settings</h2><label>Voice language</label><div class="chips"><button class="chip' + (state.lang === "en" ? "" : " on") + '" data-l="ar">العربية (مصر)</button><button class="chip' + (state.lang === "en" ? " on" : "") + '" data-l="en">English</button></div><label>Google Drive</label><div style="color:#bbb;font-size:14px;line-height:1.5">' +
    (token ? "Connected. New files are saved to the “Lektra” folder in your Drive." : "Not connected. Files stay in the app only.") +
    '</div><div class="btns" style="margin-top:10px"><button id="dr" class="ok">Connect Google Drive</button></div>', null);
  document.getElementById("dr").onclick = connectDrive;
  document.querySelectorAll("[data-l]").forEach(function (b) {
    b.onclick = function () {
      state.lang = b.getAttribute("data-l"); save();
      document.querySelectorAll("[data-l]").forEach(function (o) { o.className = "chip" + (o === b ? " on" : ""); });
    };
  });
};
render();
